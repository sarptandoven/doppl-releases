name: Doppl will not start
description: The app will not open, quits immediately, or never reaches the main window.
title: "[Will not start] "
body:
  - type: markdown
    attributes:
      value: |
        Doppl runs on your Mac and sends us nothing on its own. Everything we
        know about your problem is what you choose to put in this issue.

        **This issue is public.** Do not paste conversation or agent output,
        prompts, credentials or API keys, invitation links, repository or folder
        paths, or file contents. If you think you found a security
        vulnerability, close this and use
        [private reporting](https://github.com/sarptandoven/doppl-releases/security/advisories/new)
        instead.

  - type: input
    id: version
    attributes:
      label: Doppl version
      description: >-
        From the installer file name (for example `Doppl-0.2.3-arm64.dmg`), or
        from **Doppl → About Doppl** if the app opens far enough to show it. If
        you cannot find it, write "unknown".
      placeholder: "0.2.3"
    validations:
      required: true

  - type: dropdown
    id: mac
    attributes:
      label: Mac processor
      description: "**Apple menu → About This Mac**."
      options:
        - Apple Silicon (M1/M2/M3/M4)
        - Intel
        - Not a Mac
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: macOS version
      description: "**Apple menu → About This Mac**. Doppl supports macOS 12 Monterey or newer."
      placeholder: "macOS 14.5"
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: How far does it get?
      options:
        - The icon bounces once and nothing opens
        - macOS blocks it ("damaged", "unidentified developer", "cannot be opened")
        - A window opens but stays blank or spins forever
        - It opens, then quits by itself
        - An error message appears
        - Something else
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: The exact message on screen
      description: >-
        Copy the wording, or attach a screenshot of the dialog. A screenshot of
        an error dialog is fine; a screenshot of your work is not.
    validations:
      required: false

  - type: dropdown
    id: history
    attributes:
      label: Did this ever work on this Mac?
      options:
        - Never — this is a first install
        - It worked, then stopped after a Doppl update
        - It worked, then stopped after a macOS update
        - It worked, then stopped for no reason I can identify
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Dragged the app from the DMG into Applications
        - Ran it from inside the mounted DMG
        - Copied it from another Mac, a backup, or a shared drive
        - Not sure
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report (optional but the fastest path)
      description: >-
        In Doppl, open **Settings**, find the **Personal Doppl → Need help?**
        panel, and choose **Save diagnostic report**. Paste the JSON here. It
        contains only coded health states, version strings, and coarse
        size/age bands — no conversations, prompts, credentials, logs, or
        folder paths, and it says so in its own `privacy` block. Open the file
        and read it before you paste it. If Doppl will not open far enough to
        save one, leave this blank and say so. If you cannot find that panel
        in your Doppl window, say so in the issue — it is not shown
        everywhere, and we can still help without it.
      render: json
    validations:
      required: false

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before you submit
      options:
        - label: >-
            I have not included conversation contents, prompts, credentials,
            invitation links, or repository/folder paths.
          required: true
        - label: >-
            If I pasted a diagnostic report, I opened it first and I am willing
            for its contents to be public.
          required: false
