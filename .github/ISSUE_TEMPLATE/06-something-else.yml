name: Something else
description: Anything the other templates do not cover — including questions and suggestions.
title: "[Other] "
body:
  - type: markdown
    attributes:
      value: |
        If your problem fits one of the other templates, use that one — it asks
        the questions that get you an answer fastest. This one is for everything
        else.

        **This issue is public.** Do not paste conversation or agent output,
        prompts, credentials or API keys, backup passphrases, invitation links,
        or repository/folder paths. Suspected vulnerability? Do not describe it
        here — use
        [private reporting](https://github.com/sarptandoven/doppl-releases/security/advisories/new).

  - type: dropdown
    id: kind
    attributes:
      label: What is this?
      options:
        - Something is broken
        - Something is confusing or works differently than I expected
        - A question about how Doppl works
        - A suggestion
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Doppl version
      description: >-
        **Doppl → About Doppl**, or the installer file name. Write "n/a" if this
        is not about a specific build.
      placeholder: "0.2.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: macOS version and processor
      description: Write "n/a" if it does not apply.
      placeholder: "macOS 14.5, Apple Silicon"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >-
        What you did, what you expected, and what you got instead. Describe your
        work rather than quoting it.
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: The exact message shown, if any
      description: Copy the wording, or attach a screenshot of the message only.
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report (optional)
      description: >-
        In Doppl, open **Settings**, find the **Personal Doppl → Need help?**
        panel, and choose **Save diagnostic report**. Paste the JSON here. It
        contains only coded health states, version strings, and coarse
        size/age bands — no conversations, prompts, credentials, logs, or
        folder paths. Open the file and read it before you paste it. If you
        cannot find that panel in your Doppl window, say so in the issue — it
        is not shown everywhere, and we can still help without it.
      render: json
    validations:
      required: false

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before you submit
      options:
        - label: >-
            I have not included conversation contents, prompts, credentials,
            backup passphrases, invitation links, or repository/folder paths.
          required: true
        - label: >-
            If I pasted a diagnostic report, I opened it first and I am willing
            for its contents to be public.
          required: false
